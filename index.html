<!DOCTYPE html>
<html lang="pl" data-theme="terminal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <meta name="author" content="CodeWorks Paweł Włodarczyk">
  <meta name="robots" content="index, follow">

  <!-- Favicon & Icons -->
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#E95420">

  <!-- Zapamiętany motyw ustawiany przed pierwszym renderem (bez mignięcia) -->
  <script>
    try {
      var t = localStorage.getItem('codeworks-theme');
      if (t === 'paper' || t === 'terminal') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>

</head>
<body class="transition-colors duration-300">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
